<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9">
<title>Mineração de Ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F5F9;--cartao:#FFFFFF;--tinta:#16203A;--suave:#5E6984;--fraco:#8C95AB;--linha:#E1E6EF;--linha2:#CDD4E1;
  --azul:#2952E3;--azul-claro:#E8EDFD;
  --sobe:#0E9356;--sobe-claro:#E3F5EC;--cai:#D23A3A;--cai-claro:#FBE7E7;--alerta:#C97A00;--alerta-claro:#FDF1DC;
  --saude50:#0D9488;--emagrecimento:#E2611B;--relacionamento:#C42E79;--fitness:#6B46D9;--outro:#5E6984;
  --r1:18px;--r2:12px;--r3:8px;
  --som:0 1px 2px rgba(22,32,58,.06),0 6px 20px -8px rgba(22,32,58,.14);
  --disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --txt:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --nav:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 var(--txt);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
a{color:var(--azul);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.vazio{padding:40px 18px;text-align:center;color:var(--suave);background:var(--cartao);border:1px dashed var(--linha2);border-radius:var(--r1)}
.esconde{display:none!important}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.marca{display:flex;align-items:center;gap:10px}
.marca svg{flex:none}
.marca h1{font-size:19px;font-weight:800}
.marca small{display:block;color:var(--suave);font:500 12px/1.3 var(--txt)}
.abas{display:flex;gap:4px;margin-left:auto}
.aba{border:0;background:transparent;padding:9px 14px;border-radius:999px;color:var(--suave);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.aba:hover{background:#E7EBF3;color:var(--tinta)}
.aba[aria-selected=true]{background:var(--tinta);color:#fff}
.aba .cont{font-size:11px;background:rgba(127,138,160,.18);border-radius:999px;padding:1px 7px}
.aba[aria-selected=true] .cont{background:rgba(255,255,255,.2)}
.nav-baixo{display:none}
@media (max-width:760px){
  .abas{display:none}
  .nav-baixo{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linha);padding:6px 4px calc(6px + env(safe-area-inset-bottom));height:calc(var(--nav) + env(safe-area-inset-bottom))}
  .nav-baixo button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--fraco);padding:4px 0}
  .nav-baixo button svg{width:22px;height:22px}
  .nav-baixo button[aria-selected=true]{color:var(--azul)}
}

/* ---------- seções ---------- */
.tela{padding:20px 0 10px}
.titulo-tela{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.titulo-tela h2{font-size:26px;font-weight:800}
.titulo-tela p{margin:2px 0 0;color:var(--suave);font-size:14px}

/* ---------- hoje ---------- */
.manchete{background:var(--tinta);color:#fff;border-radius:var(--r1);padding:22px 20px;position:relative;overflow:hidden}
.manchete .quando{color:#AEB8D3;font-size:13px;font-weight:600}
.manchete h2{font-size:clamp(26px,5.4vw,38px);font-weight:800;line-height:1.1;margin:6px 0 0;max-width:22ch}
.manchete p{margin:10px 0 0;color:#C9D1E6;font-size:14.5px;line-height:1.5;max-width:62ch;position:relative}
.manchete .fundo{position:absolute;right:-10px;bottom:-14px;opacity:.16;pointer-events:none}
.numeros{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 18px}
.numero{background:var(--cartao);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--som)}
.numero b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1;font-weight:800}
.numero span{color:var(--suave);font-size:12.5px;font-weight:600;line-height:1.3;display:block}
.numero.sobe b{color:var(--sobe)}.numero.cai b{color:var(--cai)}
@media (max-width:760px){.numeros{grid-template-columns:repeat(6,1fr);gap:8px}.numero{grid-column:span 2;padding:10px 12px}.numero:nth-child(4),.numero:nth-child(5){grid-column:span 3}.numero b{font-size:24px}.numero span{font-size:12px}}
.colunas{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
@media (max-width:900px){.colunas{grid-template-columns:1fr}}
.bloco{background:var(--cartao);border-radius:var(--r1);padding:18px;box-shadow:var(--som)}
.bloco+.bloco{margin-top:18px}
.bloco h3{font-size:18px;font-weight:700;margin-bottom:10px}
.alertas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r2);background:var(--papel);cursor:default}
.alerta[data-id]{cursor:pointer}
.alerta[data-id]:hover{background:#E9EDF5}
.alerta .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.alerta .tx{font-size:14px;line-height:1.4}
.alerta .tp{display:block;font-size:12px;font-weight:700;color:var(--suave)}
.analise-txt{white-space:pre-line;font-size:15px;line-height:1.65;max-width:68ch;color:#2B3552}
.custo{display:flex;gap:16px;flex-wrap:wrap;color:var(--suave);font-size:13.5px;margin-top:10px}
.custo b{color:var(--tinta)}

/* ---------- filtros ---------- */
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.busca{flex:1;min-width:200px;position:relative}
.busca input{width:100%;border:1px solid var(--linha2);background:#fff;border-radius:999px;padding:11px 16px 11px 40px;font:inherit;color:var(--tinta)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fraco)}
select{border:1px solid var(--linha2);background:#fff;border-radius:999px;padding:10px 14px;font:inherit;font-weight:600;color:var(--tinta)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha2);background:#fff;color:var(--tinta);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip .pt{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip.limpar{border-style:dashed;color:var(--suave)}
.divisor{flex:none;width:1px;background:var(--linha2);margin:4px 2px}
.contagem{color:var(--suave);font-size:13px;margin:2px 0 12px}

/* ---------- lista de ofertas (watchlist) ---------- */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:760px){.lista{grid-template-columns:1fr;gap:10px}}
.oferta{display:grid;grid-template-columns:86px 1fr;gap:12px;background:var(--cartao);border-radius:var(--r1);padding:10px;box-shadow:var(--som);border:1px solid transparent;text-align:left;width:100%;position:relative}
.oferta:hover{border-color:var(--linha2)}
.capa{width:86px;height:118px;border-radius:var(--r2);background:#DDE3EE center/cover no-repeat;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:800;font-size:26px}
.capa .play{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.oferta .info{min-width:0;display:flex;flex-direction:column;gap:4px;padding:2px 2px 0 0}
.linha-topo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--suave)}
.nicho-tag{display:inline-flex;align-items:center;gap:5px}
.nicho-tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.selo{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--papel);color:var(--suave)}
.selo.nova{background:var(--alerta-claro);color:var(--alerta)}
.selo.fora{background:var(--azul-claro);color:var(--azul)}
.selo.radar{background:#EEE8FD;color:var(--fitness)}
.selo.mark{background:#FFF4CC;color:#7A5A00}
.oferta h3{font-size:16.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oferta .gancho{color:var(--suave);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cotacao{display:flex;align-items:flex-end;gap:10px;margin-top:auto}
.cotacao .ads{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1}
.cotacao .ads small{font:600 11.5px var(--txt);color:var(--suave);margin-left:3px}
.var{font-weight:800;font-size:13px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.var.sobe{background:var(--sobe-claro);color:var(--sobe)}.var.cai{background:var(--cai-claro);color:var(--cai)}.var.est{background:var(--papel);color:var(--suave)}
.cotacao svg,.grande svg{margin-left:auto;flex:0 1 auto;min-width:0;max-width:34%;height:auto}
.nota{position:absolute;right:10px;top:10px;font-family:var(--disp);font-weight:800;font-size:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--linha)}
.oferta .linha-topo{padding-right:44px}
.coracao{position:absolute;left:14px;top:14px;border:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ---------- folha de detalhe ---------- */
.veu{position:fixed;inset:0;background:rgba(14,20,38,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;z-index:41;background:var(--papel);overflow-y:auto;overscroll-behavior:contain;
  right:0;top:0;bottom:0;width:min(760px,100%);transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(14,20,38,.2)}
.folha.on{transform:none}
@media (max-width:760px){.folha{top:auto;left:0;width:100%;height:94vh;height:94dvh;border-radius:22px 22px 0 0;transform:translateY(100%)}.folha.on{transform:none}}
@media (prefers-reduced-motion:reduce){.folha,.veu{transition:none}}
.folha-topo{position:sticky;top:0;z-index:2;background:rgba(243,245,249,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linha)}
.folha-topo .pega{display:none}
@media (max-width:760px){.folha-topo{flex-wrap:wrap;padding-top:6px}.folha-topo .pega{display:block;width:44px;height:5px;border-radius:5px;background:var(--linha2);margin:0 auto 6px;flex-basis:100%;max-width:44px}}
.folha-topo .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fechar{border:0;background:#E3E8F1;border-radius:999px;padding:8px 14px;font-weight:700}
.folha-corpo{padding:16px}
.cab h2{font-size:clamp(22px,4vw,28px);font-weight:800;line-height:1.15;margin:8px 0 4px}
.cab .anunc{color:var(--suave);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.placar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.placar div{background:var(--cartao);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--som)}
.placar b{display:block;font-family:var(--disp);font-size:22px;font-weight:800;line-height:1.15}
.placar span{font-size:12px;color:var(--suave);font-weight:600}
@media (max-width:520px){.placar{grid-template-columns:repeat(2,1fr)}}
.sec{background:var(--cartao);border-radius:var(--r1);padding:16px;box-shadow:var(--som);margin-bottom:12px}
.sec h3{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3 small{font:600 12.5px var(--txt);color:var(--suave)}
.texto{font-size:14.5px;line-height:1.6;max-width:70ch}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.pares div span{display:block;font-size:12.5px;font-weight:700;color:var(--suave);margin-bottom:2px}
@media (max-width:560px){.pares{grid-template-columns:1fr}}
.risco{background:var(--alerta-claro);color:#6B4300;border-radius:var(--r2);padding:10px 12px;font-size:14px}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--linha2);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--tinta)}
.btn:hover{border-color:var(--tinta);text-decoration:none}
.btn.prim{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.on{background:#FFE4EC;border-color:#F3A9C0}

/* gráfico */
.grafico{width:100%;height:auto;display:block}
.grafico text{font:600 11px var(--txt);fill:var(--fraco)}

/* criativos */
.criativos{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.criativo{flex:none;width:132px;scroll-snap-align:start;color:var(--tinta)}
.criativo:hover{text-decoration:none}
.criativo .img{width:132px;height:234px;border-radius:var(--r2);background:#DDE3EE center/cover no-repeat;position:relative}
.criativo .img .play{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.criativo .img .v{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}
.criativo p{margin:6px 0 0;font-size:12.5px;line-height:1.35;color:var(--suave);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* funil */
.funil-resumo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.funil-resumo div{flex:1;min-width:120px;background:var(--papel);border-radius:var(--r2);padding:10px 12px}
.funil-resumo b{display:block;font-family:var(--disp);font-size:20px;font-weight:800}
.funil-resumo span{font-size:12px;color:var(--suave);font-weight:600}
.trilha{list-style:none;margin:0;padding:0;position:relative}
.etapa{position:relative;padding:0 0 16px 44px}
.etapa:before{content:"";position:absolute;left:15px;top:30px;bottom:-2px;width:2px;background:var(--linha2)}
.etapa:last-child{padding-bottom:0}
.etapa:last-child:before{display:none}
.etapa .no{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 0 0 4px var(--cartao)}
.etapa .cx{background:var(--papel);border-radius:var(--r2);padding:10px 12px}
.etapa .cx-topo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.etapa .nome-etapa{font-weight:800;font-size:15px}
.etapa .preco{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:17px}
.etapa .preco s{font:500 12.5px var(--txt);color:var(--fraco);margin-right:4px}
.etapa .sub{font-size:13px;color:var(--suave);line-height:1.45;margin-top:3px;word-break:break-word}
.etapa .itens{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.etapa .itens li{background:#fff;border-radius:var(--r3);padding:8px 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.etapa .itens li b.pr{margin-left:auto;font-family:var(--disp)}
.etapa .itens li small{display:block;width:100%;color:var(--fraco);font-size:12px}
.etapa.vazia .cx{background:transparent;border:1px dashed var(--linha2)}
.etapa.vazia .nome-etapa{color:var(--suave)}
.lista-simples{margin:6px 0 0;padding-left:18px;font-size:14px}
.lista-simples li{margin:2px 0}
.mudancas{list-style:none;margin:0;padding:0;font-size:14px}
.mudancas li{padding:6px 0;border-bottom:1px solid var(--linha)}
.mudancas li:last-child{border:0}
.mudancas b{font-family:var(--disp);margin-right:6px}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* hooks */
.hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:760px){.hooks{grid-template-columns:1fr}}
.hook{background:var(--cartao);border-radius:var(--r1);padding:14px 16px;box-shadow:var(--som);display:flex;flex-direction:column;gap:10px}
.hook q{font-family:var(--disp);font-size:19px;font-weight:700;line-height:1.3;quotes:"“" "”"}
.hook .rodape{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--suave)}
.hook .rodape .btn{margin-left:auto;padding:6px 12px;font-size:12.5px}
.hook-min{background:var(--papel);border-radius:var(--r2);padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hook-min q{flex:1;font-weight:600;font-size:14.5px}

/* radar */
.conc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.conc-card{background:var(--cartao);border-radius:var(--r1);padding:14px 16px;box-shadow:var(--som);display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid transparent;width:100%}
button.conc-card:hover{border-color:var(--linha2)}
.conc-card h3{font-size:16px;font-weight:700}
.conc-card .grande{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.conc-card .grande b{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1}
.barras{display:flex;flex-direction:column;gap:10px}
.barra-ang{display:grid;grid-template-columns:minmax(120px,240px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.barra-ang .trilho{height:14px;background:var(--papel);border-radius:999px;overflow:hidden}
.barra-ang .enche{height:100%;border-radius:999px}
.barra-ang .lb{font-weight:700;line-height:1.25}
.barra-ang .lb small{display:block;font-weight:600;color:var(--suave);font-size:12px}
@media (max-width:560px){.barra-ang{grid-template-columns:1fr auto}.barra-ang .trilho{grid-column:1/-1;order:3}}

/* portão */
#portao{position:fixed;inset:0;z-index:60;background:var(--tinta);display:grid;place-items:center;padding:20px}
#portao form{background:#fff;border-radius:22px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
#portao h1{font-size:26px;font-weight:800;line-height:1.1}
#portao p{margin:0;color:var(--suave);font-size:14px}
#portao input{border:1px solid var(--linha2);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
#portao button{border:0;background:var(--azul);color:#fff;border-radius:12px;padding:13px;font-weight:800;font-size:15px}
#portao .msg{min-height:20px;font-size:13.5px;color:var(--cai)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (min-width:761px){.toast{bottom:24px}}
</style>
</head>
<body>

<div id="portao">
  <form id="portao-form" autocomplete="on">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#2952E3"/><path d="M10 30l7-8 6 5 11-13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="14" r="3.5" fill="#fff"/></svg>
    <h1>Mineração de Ofertas</h1>
    <p>Digite a senha para ver as ofertas do dia.</p>
    <input id="portao-senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
    <button type="submit">Abrir painel</button>
    <div class="msg" id="portao-msg" role="status"></div>
  </form>
</div>

<header class="topo">
  <div class="wrap">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#2952E3"/><path d="M10 30l7-8 6 5 11-13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="14" r="3.5" fill="#fff"/></svg>
      <div><h1>Mineração de Ofertas</h1><small id="atualizado">—</small></div>
    </div>
    <nav class="abas" role="tablist" id="abas-topo"></nav>
  </div>
</header>

<main class="wrap">
  <section class="tela" id="tela-hoje"></section>
  <section class="tela esconde" id="tela-ofertas"></section>
  <section class="tela esconde" id="tela-radar"></section>
  <section class="tela esconde" id="tela-hooks"></section>
  <section class="tela esconde" id="tela-fora"></section>
</main>

<nav class="nav-baixo" role="tablist" id="abas-baixo"></nav>
<div class="veu" id="veu"></div>
<aside class="folha" id="folha" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="folha-titulo"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOk=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch{return""}};
const imgOk=t=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(t||"")||/^crt\/\d+\.jpg$/.test(t||"")||/^https:\/\//.test(t||"");
const dataBR=d=>{if(!d)return"—";const p=String(d).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}`:d};
const dataLonga=d=>{try{return new Date(d).toLocaleString("pt-BR",{weekday:"long",day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"})}catch{return d}};
const n=v=>{const x=Number(v);return isFinite(x)?x:null};
const fmt=v=>{const x=n(v);return x===null?"—":x.toLocaleString("pt-BR")};
const moeda=(v,m)=>{const x=n(v);if(x===null||x===0)return"";const cod=(m||"BRL").toUpperCase();try{return x.toLocaleString("pt-BR",{style:"currency",currency:cod==="R$"?"BRL":cod})}catch{return "R$ "+x.toFixed(2).replace(".",",")}};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),1800)}
function copiar(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copiado"),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado")}catch{}a.remove()})}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ================= vocabulário ================= */
const NICHO={saude50:{t:"Saúde 50+",c:"var(--saude50)",hex:"#0D9488"},emagrecimento:{t:"Emagrecimento",c:"var(--emagrecimento)",hex:"#E2611B"},relacionamento:{t:"Relacionamento",c:"var(--relacionamento)",hex:"#C42E79"},fitness:{t:"Calistenia / treino em casa",c:"var(--fitness)",hex:"#6B46D9"}};
const nicho=o=>NICHO[o.nicho]||{t:o.nicho||"Outro",c:"var(--outro)",hex:"#5E6984"};
const TIPO={info:"Infoproduto",nutra:"Nutra",fisico:"Físico",outro:"Outro"};
const tipo=o=>TIPO[o.tipo_produto]?o.tipo_produto:"outro";
const MARK={modelar:"Vou modelar",fav:"Favorita",desc:"Descartada"};
const ehFora=o=>o.la_fora===true||(o.la_fora!==false&&o.pais&&!/^BR/i.test(o.pais));
const ehRadar=o=>o.radar===true||o.nicho==="fitness"||/calisten|treino em casa|exerc[ií]cio em casa|pilates|tai chi|gl[uú]teo\/treino/i.test(o.subnicho||"");
const ALERTA={nova_oferta:{t:"Nova oferta",ic:"✦",bg:"var(--azul-claro)",c:"var(--azul)"},escalando:{t:"Escalando",ic:"▲",bg:"var(--sobe-claro)",c:"var(--sobe)"},caindo:{t:"Caindo",ic:"▼",bg:"var(--cai-claro)",c:"var(--cai)"},mudou_funil:{t:"Mudou o funil",ic:"⟳",bg:"var(--alerta-claro)",c:"var(--alerta)"},novo_concorrente:{t:"Concorrente novo",ic:"◎",bg:"#EEE8FD",c:"var(--fitness)"},saturando:{t:"Saturando",ic:"≋",bg:"var(--alerta-claro)",c:"var(--alerta)"},la_fora:{t:"Lá fora",ic:"✈",bg:"var(--azul-claro)",c:"var(--azul)"}};
const ICONES={
  hoje:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-3 4 4 8-8 3 3"/><path d="M3 20h18"/></svg>',
  ofertas:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  radar:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg>',
  hooks:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',
  fora:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'
};
const ABAS=[["hoje","Hoje"],["ofertas","Ofertas"],["radar","Radar"],["hooks","Hooks"],["fora","Lá fora"]];

/* ================= estado ================= */
let D={ofertas:[],execucao:{},analise:{},radar:{},hooks:[],alertas:[]};
const ST=Object.assign({aba:"hoje",q:"",ord:"score",nicho:"",tipo:"",status:"",tend:"",esp:"",mark:"",hq:"",hn:"",ha:""},ls.get("mo_estado",{}));
let curtidas=new Set(ls.get("mo_curtidas",[]));
const salvarEstado=()=>ls.set("mo_estado",{aba:ST.aba,ord:ST.ord,nicho:ST.nicho,tipo:ST.tipo,status:ST.status,tend:ST.tend,esp:ST.esp});

/* ================= peças ================= */
function capaDe(o){const c=(o.criativos||[]).find(c=>imgOk(c.thumb));if(c)return c.thumb;return imgOk(o.thumb_url)?o.thumb_url:""}
function variacao(o){
  const p=n(o.variacao_pct);
  if(o.tendencia==="nova"||(p===null&&o.status==="nova"))return'<span class="var est">nova</span>';
  if(p===null)return o.tendencia==="parou"?'<span class="var cai">parou</span>':"";
  if(p>=10||o.tendencia==="subindo")return`<span class="var sobe">▲ ${p>0?"+":""}${Math.round(p)}%</span>`;
  if(p<=-10||o.tendencia==="caindo")return`<span class="var cai">▼ ${Math.round(p)}%</span>`;
  return`<span class="var est">${p>0?"+":""}${Math.round(p)}%</span>`;
}
function serie(hist){return (Array.isArray(hist)?hist:[]).map(h=>({d:h.data,v:n(h.ads)})).filter(h=>h.v!==null)}
function sparkline(hist,w=84,h=30){
  const s=serie(hist);if(s.length<2)return"";
  const v=s.map(x=>x.v),mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*(w-4)+2).toFixed(1)},${(h-3-(y-mn)/r*(h-6)).toFixed(1)}`).join(" ");
  const cor=v[v.length-1]>=v[0]?"#0E9356":"#D23A3A";
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function grafico(hist){
  const s=serie(hist);
  if(s.length<2)return`<p class="texto" style="color:var(--suave)">${s.length?`${fmt(s[0].v)} anúncios em ${dataBR(s[0].d)}. `:""}O gráfico aparece a partir da segunda conferência diária.</p>`;
  const W=640,H=180,pl=38,pr=10,pt=12,pb=26,v=s.map(x=>x.v),mx=Math.max(...v),mn=Math.min(0,...v),r=(mx-mn)||1;
  const X=i=>pl+i/(s.length-1)*(W-pl-pr),Y=y=>pt+(1-(y-mn)/r)*(H-pt-pb);
  const pts=s.map((x,i)=>`${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ");
  const cor=v[v.length-1]>=v[0]?"#0E9356":"#D23A3A";
  const grade=[0,.5,1].map(f=>{const y=mn+f*r;return`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#E1E6EF"/><text x="${pl-6}" y="${Y(y)+4}" text-anchor="end">${Math.round(y)}</text>`}).join("");
  const passo=Math.max(1,Math.ceil(s.length/6));
  const rot=s.map((x,i)=>(i%passo===0||i===s.length-1)?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${dataBR(x.d)}</text>`:"").join("");
  const ult=s[s.length-1];
  return`<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Anúncios ativos por dia">${grade}<polygon points="${X(0)},${Y(mn)} ${pts} ${X(s.length-1)},${Y(mn)}" fill="${cor}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${X(s.length-1)}" cy="${Y(ult.v)}" r="4.5" fill="${cor}"/>${rot}</svg>`;
}
function selos(o){
  const t=[];
  if(o.status==="nova")t.push('<span class="selo nova">Nova</span>');
  if(ehFora(o))t.push(`<span class="selo fora">${esc(o.pais||"Lá fora")}</span>`);
  if(ehRadar(o))t.push('<span class="selo radar">Radar</span>');
  if(o.marcacao&&MARK[o.marcacao])t.push(`<span class="selo mark">${MARK[o.marcacao]}</span>`);
  if(o.curtida===true)t.push('<span class="selo mark">Gabriel curtiu</span>');
  return t.join("");
}
function corNota(s){s=n(s)||0;return s>=75?"var(--sobe)":s>=55?"var(--alerta)":"var(--linha2)"}
function cartaoOferta(o){
  const ni=nicho(o),c=capaDe(o),cv=(o.criativos||[]).some(x=>x.tipo==="video");
  return`<button class="oferta" data-oferta="${esc(o.id)}" aria-label="Abrir ${esc(o.nome)}">
    <div class="capa" style="${c?`background-image:url('${c}')`:`background:${ni.c}`}">${c?"":esc((o.nome||"?").trim()[0]||"?")}${c&&cv?'<span class="play"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#fff"/></svg></span>':""}</div>
    <span class="coracao" data-curtir="${esc(o.id)}" role="button" tabindex="0" aria-label="Curtir">${curtidas.has(o.id)?"❤️":"🤍"}</span>
    <div class="info">
      <div class="linha-topo"><span class="nicho-tag"><i style="background:${ni.c}"></i>${esc(ni.t)}</span><span>${esc(TIPO[tipo(o)])}</span><span>${esc(o.funil||"")}</span>${selos(o)}</div>
      <h3>${esc(o.nome)}</h3>
      <div class="gancho">${esc(o.gancho||o.promessa||"")}</div>
      <div class="cotacao"><span class="ads num">${fmt(o.ads_ativos)}<small>anúncios</small></span>${variacao(o)}${sparkline(o.historico)}</div>
    </div>
    <span class="nota num" style="border-color:${corNota(o.score)}" title="Nota de oportunidade">${esc(o.score??"–")}</span>
  </button>`;
}
function ligarCartoes(raiz){
  raiz.querySelectorAll("[data-oferta]").forEach(b=>b.addEventListener("click",e=>{if(e.target.closest("[data-curtir]"))return;abrir(b.dataset.oferta)}));
  raiz.querySelectorAll("[data-curtir]").forEach(b=>{const f=e=>{e.stopPropagation();e.preventDefault();curtir(b.dataset.curtir)};b.addEventListener("click",f);b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")f(e)})});
}
function curtir(id){curtidas.has(id)?curtidas.delete(id):curtidas.add(id);ls.set("mo_curtidas",[...curtidas]);render();if($("#folha").classList.contains("on"))abrir(id);toast(curtidas.has(id)?"Curtida salva neste aparelho":"Curtida removida")}

/* ================= abas ================= */
function montarAbas(){
  const cont={ofertas:ofertasVisiveis().length,radar:(D.radar?.concorrentes||[]).length||D.ofertas.filter(ehRadar).length,hooks:todosHooks().length,fora:D.ofertas.filter(ehFora).length};
  $("#abas-topo").innerHTML=ABAS.map(([k,t])=>`<button class="aba" role="tab" data-aba="${k}" aria-selected="${ST.aba===k}">${t}${cont[k]?`<span class="cont">${cont[k]}</span>`:""}</button>`).join("");
  $("#abas-baixo").innerHTML=ABAS.map(([k,t])=>`<button role="tab" data-aba="${k}" aria-selected="${ST.aba===k}">${ICONES[k]}<span>${t}</span></button>`).join("");
  document.querySelectorAll("[data-aba]").forEach(b=>b.onclick=()=>irPara(b.dataset.aba));
}
function irPara(a){ST.aba=a;salvarEstado();render();window.scrollTo({top:0})}

/* ================= tela: hoje ================= */
function telaHoje(){
  const ex=D.execucao||{},an=D.analise||{},st=ex.stats||{};
  const of=D.ofertas.filter(o=>o.marcacao!=="desc");
  const sub=of.filter(o=>o.tendencia==="subindo").length,cai=of.filter(o=>o.tendencia==="caindo").length;
  const ult=(ex.ultima_execucao||"").slice(0,10);
  const novas=st.novas??of.filter(o=>o.minerado_em===ult).length;
  const al=(D.alertas||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const alHoje=al.filter(a=>a.data===ult);const alLista=(alHoje.length?alHoje:al).slice(0,14);
  const topo=of.filter(o=>n(o.variacao_pct)!==null).sort((a,b)=>n(b.variacao_pct)-n(a.variacao_pct)).slice(0,3);
  const melhores=of.filter(o=>!topo.includes(o)).sort((a,b)=>(n(b.score)||0)-(n(a.score)||0)).slice(0,3);
  return`
  <div class="manchete">
    <div class="quando">${ex.ultima_execucao?"Mineração de "+esc(dataLonga(ex.ultima_execucao)):"Ainda sem mineração registrada"}</div>
    <h2>${manchete(novas,sub,cai,of.length)}</h2>${ex.resumo?`<p>${esc(ex.resumo)}</p>`:""}
    <svg class="fundo" width="220" height="120" viewBox="0 0 220 120" aria-hidden="true"><path d="M0 110 L40 80 L70 92 L110 50 L140 64 L180 20 L220 30" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>
  </div>
  <div class="numeros">
    <div class="numero"><b class="num">${of.length}</b><span>ofertas no painel</span></div>
    <div class="numero"><b class="num">${novas}</b><span>novas na última rodada</span></div>
    <div class="numero sobe"><b class="num">${sub}</b><span>subindo</span></div>
    <div class="numero cai"><b class="num">${cai}</b><span>caindo</span></div>
    <div class="numero"><b class="num">${of.filter(o=>o.status==="validada").length}</b><span>validadas (15+ dias)</span></div>
  </div>
  <div class="colunas">
    <div>
      <div class="bloco"><h3>${alHoje.length?"Alertas de hoje":"Últimos alertas"}</h3>
        ${alLista.length?`<ul class="alertas">${alLista.map(a=>{const t=ALERTA[a.tipo]||{t:a.tipo,ic:"•",bg:"var(--papel)",c:"var(--suave)"};return`<li class="alerta" ${a.oferta_id&&D.ofertas.some(o=>o.id===a.oferta_id)?`data-id="${esc(a.oferta_id)}" tabindex="0" role="button"`:""}><span class="ic" style="background:${t.bg};color:${t.c}">${t.ic}</span><span class="tx"><span class="tp">${esc(t.t)} · ${dataBR(a.data)}</span>${esc(a.texto)}</span></li>`}).join("")}</ul>`:`<p class="texto" style="color:var(--suave);margin:0">Sem alertas. Quando uma oferta escalar, cair ou mudar o funil, aparece aqui.</p>`}
      </div>
      <div class="bloco"><h3>Análise do dia${an.data?` <small style="font:600 13px var(--txt);color:var(--suave)">${dataBR(an.data)}</small>`:""}</h3>
        ${an.texto?`<div class="analise-txt">${esc(an.texto)}</div>`:`<p class="texto" style="color:var(--suave);margin:0">A análise geral aparece depois da próxima rodada.</p>`}
        ${ex.custo_usd!=null||ex.custo_total_usd!=null?`<div class="custo">${ex.custo_usd!=null?`<span>Custo da IA nesta rodada: <b>US$ ${Number(ex.custo_usd).toFixed(2)}</b></span>`:""}${ex.custo_total_usd!=null?`<span>Gasto total: <b>US$ ${Number(ex.custo_total_usd).toFixed(2)}</b> de 100</span>`:""}</div>`:""}
      </div>
    </div>
    <div>
      ${topo.length?`<div class="bloco"><h3>Quem mais subiu</h3><div class="lista" style="grid-template-columns:1fr">${topo.map(cartaoOferta).join("")}</div></div>`:""}
      <div class="bloco"><h3>Maiores notas</h3><div class="lista" style="grid-template-columns:1fr">${melhores.map(cartaoOferta).join("")}</div></div>
    </div>
  </div>`;
}
function manchete(nv,s,c,t){const p=[];if(nv)p.push(`${nv} oferta${nv>1?"s":""} nova${nv>1?"s":""}`);if(s)p.push(`${s} subindo`);if(c)p.push(`${c} caindo`);if(!p.length)return`${t} ofertas no painel, sem grandes mudanças`;const u=p.pop();return(p.length?p.join(", ")+" e "+u:u)}
function primeiraFrase(t){if(!t)return"";const s=String(t).split(/(?<=[.!?])\s/)[0];return s.length>140?s.slice(0,137)+"…":s}

/* ================= tela: ofertas ================= */
function ofertasVisiveis(){
  const q=ST.q.trim().toLowerCase();
  let l=D.ofertas.filter(o=>
    (ST.mark?o.marcacao===ST.mark:o.marcacao!=="desc")&&
    (!ST.nicho||o.nicho===ST.nicho)&&(!ST.tipo||tipo(o)===ST.tipo)&&(!ST.status||o.status===ST.status)&&
    (!ST.tend||o.tendencia===ST.tend)&&
    (!ST.esp||(ST.esp==="fora"?ehFora(o):ST.esp==="radar"?ehRadar(o):ST.esp==="curtidas"?curtidas.has(o.id):ST.esp==="gabriel"?o.curtida===true:true)));
  if(q)l=l.filter(o=>[o.nome,o.anunciante,o.gancho,o.mecanismo,o.promessa,o.subnicho,o.angulo,o.especialista].join(" ").toLowerCase().includes(q));
  const k=ST.ord;
  l.sort((a,b)=>k==="recentes"?String(b.minerado_em||"").localeCompare(String(a.minerado_em||"")):(n(b[k])??-1e9)-(n(a[k])??-1e9));
  return l;
}
function chip(grupo,valor,rot,ponto){const on=ST[grupo]===valor;return`<button class="chip" aria-pressed="${on}" data-g="${grupo}" data-v="${esc(valor)}">${ponto?`<span class="pt" style="background:${ponto}"></span>`:""}${esc(rot)}</button>`}
function telaOfertas(){
  const l=ofertasVisiveis();
  const algum=ST.nicho||ST.tipo||ST.status||ST.tend||ST.esp||ST.mark||ST.q;
  const nichos=[...new Set(D.ofertas.map(o=>o.nicho).filter(Boolean))];
  return`
  <div class="titulo-tela"><div><h2>Ofertas</h2><p>Toque numa oferta para ver o funil completo, criativos e hooks.</p></div></div>
  <div class="barra">
    <label class="busca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="busca" placeholder="Buscar por nome, anunciante, mecanismo…" value="${esc(ST.q)}" aria-label="Buscar ofertas"></label>
    <select id="ordem" aria-label="Ordenar">
      ${[["score","Maior nota"],["ads_ativos","Mais anúncios"],["variacao_pct","Mais subindo"],["dias_ativa","Rodando há mais tempo"],["recentes","Mineradas por último"]].map(([v,t])=>`<option value="${v}" ${ST.ord===v?"selected":""}>${t}</option>`).join("")}
    </select>
  </div>

      <div class="tags"><span class="selo">${esc(TIPO[tipo(o)])}</span>${o.funil?`<span class="selo">${esc(o.funil)}</span>`:""}<span class="selo">${o.nivel==="grey"?"Grey":"White"}</span>${o.rosto_famoso===true?'<span class="selo" style="background:var(--cai-claro);color:var(--cai)">Depende de famoso</span>':'<span class="selo" style="background:var(--sobe-claro);color:var(--sobe)">Modelável</span>'}${selos(o)}</div>
    </div>
    <div class="placar">
      <div><b class="num">${esc(o.score??"–")}</b><span>nota de oportunidade</span></div>
      <div><b class="num">${fmt(o.ads_ativos)}</b><span>anúncios ativos</span></div>
      <div><b class="num">${n(o.variacao_pct)===null?"—":(o.variacao_pct>0?"+":"")+Math.round(o.variacao_pct)+"%"}</b><span>desde a última conferência</span></div>
      <div><b class="num">${fmt(o.dias_ativa)}</b><span>dias no ar${o.inicio?" · desde "+dataBR(o.inicio):""}</span></div>
    </div>
    <div class="sec"><div class="botoes"><button class="btn ${curtidas.has(o.id)?"on":""}" id="b-curtir">${curtidas.has(o.id)?"❤️ Curtida":"🤍 Curtir"}</button>${links.map(([t,u])=>`<a class="btn" href="${esc(urlOk(u))}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div></div>
    <div class="sec"><h3>Anúncios ativos por dia</h3>${grafico(o.historico)}</div>
    <div class="sec"><h3>Por que vale olhar</h3><p class="texto" style="margin:0 0 14px">${esc(o.por_que||"—")}</p>
      <div class="pares">
        <div><span>Gancho</span>${esc(o.gancho||"—")}</div>
        <div><span>Promessa</span>${esc(o.promessa||"—")}</div>
        <div><span>Mecanismo</span>${esc(o.mecanismo||"—")}</div>
        ${o.angulo?`<div><span>Ângulo</span>${esc(o.angulo)}</div>`:""}
        ${o.preco?`<div><span>Preço</span>${esc(o.preco)}</div>`:""}
        ${o.especialista?`<div><span>Autoridade usada</span>${esc(o.especialista)}</div>`:""}
      </div>
      ${o.riscos?`<div class="risco" style="margin-top:14px"><b>Cuidado:</b> ${esc(o.riscos)}</div>`:""}
    </div>
    ${funilHtml(o)}
    <div class="sec"><h3>Criativos <small>${cs.length?`toque para ver na Biblioteca`:""}</small></h3>
      ${cs.length?`<div class="criativos">${cs.map(c=>`<a class="criativo" href="https://www.facebook.com/ads/library/?id=${encodeURIComponent(c.ad_id)}" target="_blank" rel="noopener"><div class="img" style="${imgOk(c.thumb)?`background-image:url('${c.thumb}')`:""}"><span class="play">${c.tipo==="video"?"Vídeo":c.tipo==="carrossel"?"Carrossel":"Imagem"}</span>${n(c.versoes)>1?`<span class="v">${c.versoes}×</span>`:""}</div><p>${c.inicio?`<b>desde ${esc(c.inicio)}</b> `:""}${esc((c.texto||"").slice(0,110))}</p></a>`).join("")}</div>`:`<p class="texto" style="margin:0;color:var(--suave)">Ainda não coletados.</p>`}
    </div>
    ${(o.hooks||[]).length?`<div class="sec"><h3>Hooks desta oferta</h3>${o.hooks.map((h,i)=>`<div class="hook-min"><q>${esc(h.texto)}</q><button class="btn" data-hcop="${i}">Copiar</button></div>`).join("")}</div>`:""}
    ${o.analise?`<div class="sec"><h3>Histórico de conferências</h3><p class="texto" style="margin:0;white-space:pre-line;color:#2B3552">${esc(o.analise)}</p></div>`:""}
    <p style="color:var(--fraco);font-size:12.5px;margin:4px 4px 20px">Fonte: ${o.fonte==="swipe"?"Swipe Offers":o.fonte==="ambas"?"Swipe Offers e Biblioteca da Meta":o.fonte==="tiktok"?"TikTok Creative Center":"Biblioteca da Meta"} · minerada em ${dataBR(o.minerado_em)} · ${esc(o.idioma||"")} ${esc(o.pais||"")}</p>
  </div>`;
  const fl=$("#folha");fl.classList.add("on");fl.setAttribute("aria-hidden","false");fl.scrollTop=0;$("#veu").classList.add("on");document.body.style.overflow="hidden";
  $("#fechar").onclick=fechar;$("#fechar").focus({preventScroll:true});fechar._volta=ultimoFoco;
  $("#b-curtir").onclick=()=>curtir(o.id);
  fl.querySelectorAll("[data-hcop]").forEach(b=>b.onclick=()=>copiar(o.hooks[+b.dataset.hcop].texto));
  try{history.replaceState(null,"","#"+encodeURIComponent(o.id))}catch{}
}
function fechar(){const fl=$("#folha");if(!fl.classList.contains("on"))return;fl.classList.remove("on");fl.setAttribute("aria-hidden","true");$("#veu").classList.remove("on");document.body.style.overflow="";try{history.replaceState(null,"",location.pathname+location.search)}catch{}if(fechar._volta&&fechar._volta.focus)fechar._volta.focus({preventScroll:true})}
$("#veu").onclick=fechar;
document.addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});

/* ================= render ================= */
function render(){
  montarAbas();
  for(const [k] of ABAS){const t=$("#tela-"+k);t.classList.toggle("esconde",ST.aba!==k);if(ST.aba!==k)t.innerHTML=""}
  const el=$("#tela-"+ST.aba);
  el.innerHTML=ST.aba==="hoje"?telaHoje():ST.aba==="ofertas"?telaOfertas():ST.aba==="radar"?telaRadar():ST.aba==="hooks"?telaHooks():telaFora();
  ligarCartoes(el);
  if(ST.aba==="ofertas")ligarOfertas(el);
  if(ST.aba==="hooks")ligarHooks(el);
  el.querySelectorAll(".alerta[data-id]").forEach(a=>{const f=()=>abrir(a.dataset.id);a.onclick=f;a.onkeydown=e=>{if(e.key==="Enter")f()}});
}
function carregar(d){
  D={ofertas:Array.isArray(d.ofertas)?d.ofertas:[],execucao:d.execucao||{},analise:d.analise||{},radar:d.radar||{},hooks:Array.isArray(d.hooks)?d.hooks:[],alertas:Array.isArray(d.alertas)?d.alertas:[]};
  const ex=D.execucao;
  $("#atualizado").textContent=ex.ultima_execucao?"Atualizado "+new Date(ex.ultima_execucao).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):`${D.ofertas.length} ofertas`;
  if(!ABAS.some(([k])=>k===ST.aba))ST.aba="hoje";
  render();
  const h=decodeURIComponent(location.hash.slice(1));if(h&&D.ofertas.some(o=>o.id===h))abrir(h);
}

/* ================= dados criptografados (AES-GCM + PBKDF2) ================= */
async function decifrar(senha){
  const r=await fetch("data.enc.json?v="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("Não consegui baixar os dados ("+r.status+"). Tente de novo em instantes.");
  const e=await r.json(),b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(e.iv)},k,b(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tentar(senha,lembrar){
  try{const d=await decifrar(senha);carregar(d);$("#portao").remove();if(lembrar){try{sessionStorage.setItem("mo_pw",senha)}catch{}}return true}
  catch(e){return e}
}
(async()=>{
  let s=null;try{s=sessionStorage.getItem("mo_pw")}catch{}
  if(s&&(await tentar(s,false))===true)return;
  const f=$("#portao-form"),m=$("#portao-msg");$("#portao-senha").focus();
  f.onsubmit=async ev=>{ev.preventDefault();m.style.color="var(--suave)";m.textContent="Abrindo…";const r=await tentar($("#portao-senha").value,true);if(r!==true){m.style.color="var(--cai)";m.textContent=(r&&r.name==="OperationError")?"Senha incorreta. Confira e tente de novo.":(r&&r.message)||"Não consegui abrir o painel."}};
})();
</script>
